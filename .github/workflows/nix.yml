on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: "nix"
  cancel-in-progress: true

jobs:
  build-nix-packages:
    name: Build and push Nix packages (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
      - name: Install Nix
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          add-channel: "true"
          extra-conf: |
            extra-substituters = ${{ vars.NIKS3_SERVER_URL }}
            extra-trusted-public-keys = ${{ vars.NIKS3_PUBLIC_KEY }}
      - id: build
        name: Build packages
        run: |
          echo "sandhole=$(nix build .#sandhole --no-link --print-out-paths)" >> $GITHUB_OUTPUT
          echo "udp_over_tcp=$(nix build .#udp_over_tcp --no-link --print-out-paths)" >> $GITHUB_OUTPUT
      - name: Install niks3
        run: |
          nix-env -iA niks3 -f '<nixpkgs>'
      - name: Push to niks3
        env:
          NIKS3_AUTH_TOKEN_FILE: "/tmp/niks3-token"
          NIKS3_SERVER_URL: ${{ vars.NIKS3_SERVER_URL }}
          SANDHOLE_PATH: ${{ steps.build.outputs.sandhole }}
          UDP_OVER_TCP_PATH: ${{ steps.build.outputs.udp_over_tcp }}
        run: |
          echo ${{ secrets.NIKS3_AUTH_TOKEN }} > /tmp/niks3-token
          niks3 push ${SANDHOLE_PATH} ${UDP_OVER_TCP_PATH}
  build-docker:
    name: Build Docker
    permissions:
      contents: read
      packages: write
    needs:
      - build-nix-packages
    uses: ./.github/workflows/docker.yml
    secrets:
      dockerhub-push-token: ${{ secrets.DOCKERHUB_PUSH_TOKEN  }}
      ghcr-push-token: ${{ secrets.GITHUB_TOKEN }}

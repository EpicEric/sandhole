on:
  workflow_call:
    secrets:
      dockerhub-push-token:
        description: Authentication token to push images to Docker Hub.
        required: true
      ghcr-push-token:
        description: Authentication token to push images to the Github Container Registry.
        required: true

jobs:
  build-docker-image:
    name: Build Docker image (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            key: amd64
          - runner: ubuntu-24.04-arm
            key: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        run: |
          DOCKER_PATH=$(nix build .#docker --no-link --print-out-paths)
          cp "$DOCKER_PATH" image.tar.gz
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-${{ matrix.key }}
          path: image.tar.gz

  push-docker-image:
    name: Push Docker image
    runs-on: ubuntu-24.04
    needs:
      - build-docker-image
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Collect Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_IMAGE }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=,suffix=,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          cache-binary: false
      - name: Login to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.dockerhub-push-token  }}
      - name: Login to Github Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ghcr-push-token }}
      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install skopeo
        run: |
          nix-env -iA skopeo -f '<nixpkgs>'
      - name: Download docker-amd64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-amd64
          path: docker-amd64/
      - name: Download docker-arm64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-arm64
          path: docker-arm64/
      - name: Push and assemble manifests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue

            skopeo copy docker-archive:docker-amd64/image.tar.gz "docker://${TAG}-amd64"
            skopeo copy docker-archive:docker-arm64/image.tar.gz "docker://${TAG}-arm64"

            docker buildx imagetools create --tag "$TAG" "${TAG}-amd64" "${TAG}-arm64"
          done <<< "$TAGS"
